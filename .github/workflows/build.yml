# =============================================================================
# build.yml  —  lives in the PUBLIC repo:  codeman9528/QuasarAPP-build
# Copy this file to that repo at  .github/workflows/build.yml
#
# Heavy, free compile of a branded Quasar client. NO real signing key here:
# desktop updater artifacts are built with a throwaway ephemeral key (.sig
# discarded); the Android APK is left UNSIGNED. Everything is uploaded to R2
# staging under one $BUILD_ID/ prefix, then ONE hand-off dispatches the private
# repo's sign.yml which re-signs with the real L3 / release keys.
#
# ── Single-workflow fan-in (ADR-013 + console targets) ───────────────────────
# The console passes `targets` (windows,macos,linux,android,androidtv). A `setup`
# job turns that into a desktop build matrix + an android flag; `compile` and
# `android` run only for selected platforms; `handoff` waits for BOTH and
# dispatches sign.yml EXACTLY ONCE. sign.yml pulls the whole $BUILD_ID/ staging
# and signs whatever is there, so a mixed desktop+android build yields ONE
# signed bundle with ONE merged installers.json — no manifest clobber, one
# callback. (Previously android lived in a separate build-android.yml the
# console never triggered, and two independent sign runs clobbered the manifest.)
#
# ⚠️ AUTHORED WITHOUT A FULL CI DRY RUN — expect iteration. Likely spots: the
#    dynamic matrix (fromJSON), the android job's NDK/gomobile steps (same ones
#    build-android.yml is still shaking out), and the handoff `if:` gating.
#    build-android.yml is KEPT as a manual android-only escape hatch; the console
#    path is THIS file. Do not run both for one build_id (double sign dispatch).
#
# NOTE: pin every third-party action to a commit SHA before production.
# =============================================================================
name: build

on:
  workflow_dispatch:
    inputs:
      slug:      { description: "brand slug (brands/<slug>/brand.yaml must exist in the private repo)", required: true }
      version:   { description: "release version, e.g. 1.4.2", required: true }
      build_id:  { description: "orchestrator build id (echoed back in the dispatch)", required: true }
      notes:     { description: "更新内容 (release notes, shown in the client update dialog)", required: false, default: "" }
      targets:   { description: "comma-separated platforms: windows,macos,linux,android,androidtv (blank = all)", required: false, default: "" }

concurrency:
  group: build-${{ inputs.slug }}-${{ inputs.version }}
  cancel-in-progress: false

env:
  SLUG:     ${{ inputs.slug }}
  VERSION:  ${{ inputs.version }}
  BUILD_ID: ${{ inputs.build_id }}
  # Operator-wide PUBLIC key — repo *variable*, not a secret (pubkeys aren't secret).
  TAURI_UPDATER_PUBKEY:  ${{ vars.TAURI_UPDATER_PUBKEY }}
  # R2 staging endpoint + WRITE-ONLY-to-staging token (leak = throwaway bucket only).
  R2_ENDPOINT:           ${{ vars.R2_ENDPOINT }}            # https://<acct>.r2.cloudflarestorage.com
  AWS_ACCESS_KEY_ID:     ${{ secrets.R2_STAGING_KEY_ID }}
  AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_STAGING_SECRET }}
  AWS_DEFAULT_REGION:    auto
  STAGING_BUCKET:        ${{ vars.STAGING_BUCKET }}         # e.g. quasar-staging

jobs:
  # ── Plan which platform jobs run, from the console's `targets` list ──────────
  setup:
    runs-on: ubuntu-latest
    outputs:
      desktop_matrix: ${{ steps.plan.outputs.desktop_matrix }}
      build_android:  ${{ steps.plan.outputs.build_android }}
    steps:
      - name: Plan jobs from targets
        id: plan
        shell: bash
        run: |
          set -euo pipefail
          targets="${{ inputs.targets }}"
          [ -z "$targets" ] && targets="windows,macos,linux,android,androidtv"
          matrix="[]"; android=false
          IFS=',' read -ra T <<< "$targets"
          for t in "${T[@]}"; do
            t="$(echo "$t" | xargs)"   # trim whitespace
            case "$t" in
              windows) matrix=$(jq -c '. + [{"os":"windows-latest","arch":"windows-x86_64"}]' <<<"$matrix") ;;
              macos)   matrix=$(jq -c '. + [{"os":"macos-14","arch":"darwin-universal"}]' <<<"$matrix") ;;  # universal = arm64 + x86_64 fat binary, one pkg for every Mac
              linux)   matrix=$(jq -c '. + [{"os":"ubuntu-latest","arch":"linux-x86_64"}]' <<<"$matrix") ;;
              android|androidtv) android=true ;;
              *) echo "::warning::unknown target ignored: $t" ;;
            esac
          done
          echo "desktop_matrix=$matrix" >> "$GITHUB_OUTPUT"
          echo "build_android=$android" >> "$GITHUB_OUTPUT"
          echo "· plan: desktop=$matrix  android=$android" | tee -a "$GITHUB_STEP_SUMMARY"

  # ── Desktop compile (one job per selected desktop arch) ──────────────────────
  compile:
    needs: setup
    if: ${{ needs.setup.outputs.desktop_matrix != '[]' }}
    strategy:
      # Partial success: one arch failing must NOT cancel the others — they still
      # build + stage, and handoff publishes whatever succeeded.
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.setup.outputs.desktop_matrix) }}
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout PRIVATE source (read-only deploy key)
        uses: actions/checkout@v4
        with:
          repository: codeman9528/QuasarAPP
          ssh-key: ${{ secrets.PRIVATE_REPO_DEPLOY_KEY }}

      # Builds float to main HEAD (no per-build ref pin), so record the exact
      # commit that produced this artifact — provenance + reproducibility.
      - name: Record source commit
        id: src
        shell: bash
        run: |
          set -euo pipefail
          sha="$(git rev-parse HEAD)"
          echo "sha=$sha" >> "$GITHUB_OUTPUT"
          echo "· built ${{ inputs.slug }} v${{ inputs.version }} ${{ matrix.arch }} from private@$sha" \
            | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Linux build deps
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update
          # `rpm` provides rpmbuild — without it Tauri silently skips the .rpm
          # bundle. dpkg-dev backs the .deb. (webkit2gtk etc. for the app itself.)
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev \
            librsvg2-dev patchelf build-essential file rpm dpkg-dev

      - uses: dtolnay/rust-toolchain@1.82.0
      - uses: Swatinem/rust-cache@v2
      # No version here — pnpm/action-setup@v4 errors if a version is set both
      # here AND via package.json's packageManager (pnpm@9.12.0). Let it read that.
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20, cache: pnpm }

      - name: Install Tauri CLI
        run: cargo install tauri-cli --version "^2.1" --locked

      - name: Build UI bundle
        run: |
          pnpm install --frozen-lockfile
          pnpm -C apps/ui build

      - name: Apply brand (patches tauri.conf.json + icons + .cargo env)
        run: cargo run -p quasar-builder -- apply --brand "brands/${{ inputs.slug }}/brand.yaml"

      - name: Regenerate icon set from brand icon.png (if the console uploaded one)
        shell: bash
        run: |
          set -euo pipefail
          if [ -f "brands/${{ inputs.slug }}/icon.png" ]; then
            echo "branding app icon from brands/${{ inputs.slug }}/icon.png"
            cargo tauri icon "brands/${{ inputs.slug }}/icon.png" -o crates/tauri-app/icons
          else
            echo "no brand icon.png — using repo default icons"
          fi

      - name: Generate EPHEMERAL signing key (discarded; real key is in sign.yml)
        shell: bash
        run: |
          cargo tauri signer generate -w "$RUNNER_TEMP/eph.key" -p "" >/dev/null 2>&1
          echo "TAURI_SIGNING_PRIVATE_KEY=$(cat "$RUNNER_TEMP/eph.key")" >> "$GITHUB_ENV"
          echo "TAURI_SIGNING_PRIVATE_KEY_PASSWORD=" >> "$GITHUB_ENV"

      - name: Fetch geo databases (bundled so the client loads geoip locally,
              not from GitHub at runtime — blocked behind the GFW; ADR-014 §6)
        shell: bash
        run: bash scripts/fetch-geo.sh crates/tauri-app/resources/geo

      - name: Fetch kernel binaries (bundled so a fresh install works offline —
              no first-run OTA download; OTA handles later upgrades)
        shell: bash
        env:
          # Universal macOS → lipo-merge both darwin arches of sing-box/xray into
          # fat binaries so the one universal .app runs on Apple Silicon AND Intel.
          MACOS_UNIVERSAL: ${{ matrix.arch == 'darwin-universal' && '1' || '0' }}
        run: bash scripts/fetch-kernels.sh crates/tauri-app/resources/kernels

      # The desktop TUN root helper (binary + macOS launchd plist) is bundled into
      # the app's Resources/helper (all 3 desktop confs list "resources/helper").
      # Both are gitignored, so CI must stage them or TUN install fails with
      # "helper binary not found" / "launchd plist not found". stage-helper.sh
      # builds the binary AND generates the plist with the brand slug substituted
      # into the launchd Label / socket path (must run AFTER the brand patch so
      # the plist's io.<slug>.helper matches the client's brand-aware socket).
      - name: Build + stage TUN root helper (binary + brand plist)
        shell: bash
        env:
          QUASAR_APP_SLUG: ${{ inputs.slug }}
        run: |
          # Universal macOS → build the helper as a fat arm64+x86_64 binary too,
          # else TUN breaks on Intel (see stage-helper.sh). Other arches: host build.
          if [ "${{ matrix.arch }}" = "darwin-universal" ]; then
            bash scripts/stage-helper.sh universal-apple-darwin
          else
            bash scripts/stage-helper.sh
          fi

      # macOS ships a UNIVERSAL binary (arm64 + x86_64) so one .pkg installs on
      # every Mac. universal-apple-darwin needs BOTH rust std targets present.
      - name: Add macOS universal rust targets
        if: matrix.arch == 'darwin-universal'
        run: rustup target add aarch64-apple-darwin x86_64-apple-darwin

      - name: Build app (installers + updater archives)
        shell: bash
        run: |
          if [ "${{ matrix.arch }}" = "darwin-universal" ]; then
            cargo tauri build --target universal-apple-darwin
          else
            cargo tauri build
          fi

      - name: Collect updater archive + installer
        id: collect
        shell: bash
        run: |
          set -euo pipefail
          # --target universal-apple-darwin nests the bundle under the target triple.
          if [ "${{ matrix.arch }}" = "darwin-universal" ]; then
            base="target/universal-apple-darwin/release/bundle"
          else
            base="target/release/bundle"
          fi
          case "${{ matrix.arch }}" in
            linux-*)
              # Tauri 2 signs the AppImage directly (…AppImage + …AppImage.sig),
              # NOT a .AppImage.tar.gz. The AppImage is both the updater artifact
              # (auto-update only works for AppImage on Linux) and a portable
              # direct-download installer.
              up=$(ls "$base"/appimage/*.AppImage | head -1)
              inst="$up"
              # Also ship .deb + .rpm: they use the SYSTEM webkit2gtk (a package
              # dependency, not bundled) so they're ~1/3 the AppImage's size. They
              # are install-only (no auto-update — that stays AppImage-only). Staged
              # under their own platform keys (linux-*-deb / -rpm) so installers.json
              # lists all three. Best-effort (a target may not have built).
              deb=$(ls "$base"/deb/*.deb 2>/dev/null | head -1 || true)
              rpm=$(ls "$base"/rpm/*.rpm 2>/dev/null | head -1 || true)
              echo "deb=$deb" >> "$GITHUB_OUTPUT"
              echo "deb_name=$([ -n "$deb" ] && basename "$deb" || echo '')" >> "$GITHUB_OUTPUT"
              echo "rpm=$rpm" >> "$GITHUB_OUTPUT"
              echo "rpm_name=$([ -n "$rpm" ] && basename "$rpm" || echo '')" >> "$GITHUB_OUTPUT"
              ;;
            windows-*)
              # Tauri 2: the NSIS -setup.exe is the updater artifact (+ .sig);
              # there is no -setup.nsis.zip. It's also the direct-download installer.
              up=$(ls "$base"/nsis/*-setup.exe | head -1)
              inst="$up" ;;
            darwin-*)
              up=$(ls "$base"/macos/*.app.tar.gz)
              # Ship a .pkg installer, NOT the .dmg. A pkg installer writes the app
              # FRESH into /Applications, so the installed app carries no
              # com.apple.quarantine flag → it launches with zero Gatekeeper
              # prompts even though we don't notarize (this is how the mainstream
              # un-notarized clients ship). A dragged-out .dmg app inherits the
              # download's quarantine → the "已损坏" dead-end on Apple Silicon.
              # Unsigned pkg over an ad-hoc-signed app — no Apple Developer account.
              app=$(ls -d "$base"/macos/*.app | head -1)
              appname=$(basename "$app" .app)
              ident=$(/usr/libexec/PlistBuddy -c "Print :CFBundleIdentifier" "$app/Contents/Info.plist")
              ver=$(/usr/libexec/PlistBuddy -c "Print :CFBundleShortVersionString" "$app/Contents/Info.plist")
              a="${{ matrix.arch }}"; a="${a#darwin-}"
              comp="$RUNNER_TEMP/component.pkg"
              inst="$RUNNER_TEMP/${appname}_${ver}_${a}.pkg"
              pkgbuild --install-location /Applications --component "$app" \
                       --identifier "$ident" --version "$ver" "$comp"
              # productbuild wraps the component so Installer shows the standard
              # wizard (介绍 / 目的宗卷 / 安装类型 / 安装 / 摘要).
              productbuild --package "$comp" "$inst" ;;
          esac
          echo "updater=$up" >> "$GITHUB_OUTPUT"
          echo "updater_name=$(basename "$up")" >> "$GITHUB_OUTPUT"
          echo "installer=$inst" >> "$GITHUB_OUTPUT"
          echo "installer_name=$([ -n "$inst" ] && basename "$inst" || echo '')" >> "$GITHUB_OUTPUT"

      - name: Upload UNSIGNED updater + installer to R2 staging
        shell: bash
        env:
          # Force legacy checksum behavior — aws cli v2.23+ CRC checksums make
          # Cloudflare R2 reject the request (401 Unauthorized).
          AWS_REQUEST_CHECKSUM_CALCULATION: when_required
          AWS_RESPONSE_CHECKSUM_VALIDATION: when_required
        run: |
          set -euo pipefail
          bid="${{ inputs.build_id }}"; arch="${{ matrix.arch }}"
          # A universal macOS build is ONE fat artifact that must be offered to
          # BOTH darwin-aarch64 AND darwin-x86_64 clients: the Tauri updater/client
          # reports the RUNNING arch, never "universal", so a lone darwin-universal
          # manifest key matches nobody → macOS auto-update silently dead. Publish
          # the SAME file under both real-arch keys (updater + installer).
          if [ "$arch" = "darwin-universal" ]; then keys="darwin-aarch64 darwin-x86_64"; else keys="$arch"; fi
          # Single-part PUT (s3api put-object), NOT `aws s3 cp`: cp goes multipart
          # for files >8MB and R2 bucket-scoped tokens reject CreateMultipartUpload.
          for k in $keys; do
            aws s3api put-object --endpoint-url "$R2_ENDPOINT" \
              --bucket "$STAGING_BUCKET" \
              --key "$bid/updater/$k/${{ steps.collect.outputs.updater_name }}" \
              --body "${{ steps.collect.outputs.updater }}" >/dev/null
            # Installer (direct download; not Tauri-signed).
            if [ -n "${{ steps.collect.outputs.installer_name }}" ]; then
              aws s3api put-object --endpoint-url "$R2_ENDPOINT" \
                --bucket "$STAGING_BUCKET" \
                --key "$bid/installer/$k/${{ steps.collect.outputs.installer_name }}" \
                --body "${{ steps.collect.outputs.installer }}" >/dev/null
            else
              echo "no installer bundle for $arch (check tauri.conf bundle targets)"
            fi
          done
          # Extra Linux formats under their own platform keys (empty on non-Linux).
          if [ -n "${{ steps.collect.outputs.deb_name }}" ]; then
            aws s3api put-object --endpoint-url "$R2_ENDPOINT" --bucket "$STAGING_BUCKET" \
              --key "$bid/installer/${arch}-deb/${{ steps.collect.outputs.deb_name }}" \
              --body "${{ steps.collect.outputs.deb }}" >/dev/null
          fi
          if [ -n "${{ steps.collect.outputs.rpm_name }}" ]; then
            aws s3api put-object --endpoint-url "$R2_ENDPOINT" --bucket "$STAGING_BUCKET" \
              --key "$bid/installer/${arch}-rpm/${{ steps.collect.outputs.rpm_name }}" \
              --body "${{ steps.collect.outputs.rpm }}" >/dev/null
          fi

  # ── Android compile (universal APK; runs only when android/androidtv selected) ─
  # Mirrors build-android.yml's `apk` job, MINUS its own sign dispatch — the
  # shared `handoff` job dispatches sign.yml once for desktop + android together.
  android:
    needs: setup
    if: ${{ needs.setup.outputs.build_android == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout PRIVATE source (read-only deploy key)
        uses: actions/checkout@v4
        with:
          repository: codeman9528/QuasarAPP
          ssh-key: ${{ secrets.PRIVATE_REPO_DEPLOY_KEY }}

      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: "17" }

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
      - name: Install NDK + platform + build-tools
        run: sdkmanager "ndk;28.0.13004108" "platforms;android-34" "build-tools;34.0.0"

      # Pin NDK_HOME to the exact NDK we just installed (setup-android sets
      # ANDROID_NDK_ROOT only as a process var; tauri android init hard-fails on a
      # bad NDK_HOME). Exporting to $GITHUB_ENV makes it valid for every later step.
      - name: Pin NDK_HOME
        run: |
          NDK="$ANDROID_HOME/ndk/28.0.13004108"
          test -d "$NDK" || { echo "NDK not at $NDK"; ls "$ANDROID_HOME/ndk" || true; exit 1; }
          echo "NDK_HOME=$NDK" >> "$GITHUB_ENV"
          echo "ANDROID_NDK_ROOT=$NDK" >> "$GITHUB_ENV"
          echo "ANDROID_NDK_HOME=$NDK" >> "$GITHUB_ENV"

      # Go is needed for the gomobile AAR (the embedded sing-box core).
      - uses: actions/setup-go@v5
        with: { go-version: "1.23" }

      - uses: dtolnay/rust-toolchain@1.82.0
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi
      - uses: Swatinem/rust-cache@v2
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20, cache: pnpm }

      - name: Install Tauri CLI
        run: cargo install tauri-cli --version "^2.1" --locked

      - name: Build UI bundle
        run: |
          pnpm install --frozen-lockfile
          pnpm -C apps/ui build

      - name: Apply brand
        if: inputs.slug != ''
        run: cargo run -p quasar-builder -- apply --brand "brands/${{ inputs.slug }}/brand.yaml"

      # Regenerate the FULL icon set (incl. Android launcher mipmaps) from the
      # operator's uploaded logo so the console's custom icon reaches the APK.
      - name: Regenerate icon set from brand icon.png (if the console uploaded one)
        if: inputs.slug != ''
        shell: bash
        run: |
          set -euo pipefail
          if [ -f "brands/${{ inputs.slug }}/icon.png" ]; then
            echo "branding app icon from brands/${{ inputs.slug }}/icon.png"
            cargo tauri icon "brands/${{ inputs.slug }}/icon.png" -o crates/tauri-app/icons
          else
            echo "no brand icon.png — using repo default icons"
          fi

      # Android-TV 16:9 banner (320×180) from the brand icon — shown on the TV
      # home launcher. Best-effort: a committed default tv_banner.png already
      # exists in the overlay res, so a failure here just keeps the default (the
      # manifest's @drawable/tv_banner always resolves → build never breaks).
      - name: Generate branded TV banner (Android)
        if: inputs.slug != ''
        shell: bash
        run: |
          SRC="brands/${{ inputs.slug }}/icon.png"
          DEST="crates/tauri-app/android/app/src/main/res/drawable/tv_banner.png"
          [ -f "$SRC" ] || { echo "no brand icon — keeping default TV banner"; exit 0; }
          sudo apt-get install -y imagemagick >/dev/null 2>&1 || true
          M=convert; command -v magick >/dev/null 2>&1 && M=magick
          if "$M" -size 320x180 "xc:#191228" \( "$SRC" -resize 132x132 \) -gravity center -composite "$DEST"; then
            echo "branded TV banner from $SRC"
          else
            echo "banner generation failed — keeping committed default"
          fi

      - name: Fetch geo databases (bundled into the apk assets)
        run: bash scripts/fetch-geo.sh crates/tauri-app/resources/geo || echo "geo fetch failed (non-fatal)"

      # White-label identity split: Kotlin package + JNI exports are hardcoded
      # io.quasar.app, so the android CODE identity must stay io.quasar.app.
      # Capture the brand identifier as the applicationId, reset the identifier to
      # io.quasar.app so `tauri android init` generates code under io.quasar.app;
      # finalize-gradle re-applies ANDROID_APP_ID as the applicationId only.
      - name: Pin android code identity to io.quasar.app; brand the applicationId
        if: inputs.slug != ''
        run: |
          conf=crates/tauri-app/tauri.conf.json
          brand_id="$(python3 -c "import json;print(json.load(open('$conf'))['identifier'])")"
          echo "ANDROID_APP_ID=$brand_id" >> "$GITHUB_ENV"
          python3 -c "import json;p='$conf';d=json.load(open(p));d['identifier']='io.quasar.app';json.dump(d,open(p,'w'),indent=2)"
          echo "code identity → io.quasar.app; applicationId → $brand_id"

      - name: Build embedded sing-box core AAR (arm64 + arm7)
        env:
          NDK_HOME: ${{ env.ANDROID_NDK_ROOT }}
        run: TARGETS=android/arm64,android/arm bash scripts/build-qcore-aar.sh

      - name: Init Android project (generates gen/android)
        env:
          NDK_HOME: ${{ env.ANDROID_NDK_ROOT }}
        run: |
          cd crates/tauri-app
          cargo tauri android init

      - name: Finalize gradle (link the core AAR) + overlay VPN/L3 sources
        run: |
          bash scripts/android-finalize-gradle.sh
          bash scripts/android-overlay.sh

      - name: Build UNSIGNED RELEASE universal APK (arm64-v8a + armeabi-v7a)
        env:
          NDK_HOME: ${{ env.ANDROID_NDK_ROOT }}
        # No ANDROID_KEYSTORE in env → build-android-apk.sh leaves it unsigned;
        # sign.yml signs it in the private repo with the real release key.
        run: bash scripts/build-android-apk.sh

      - name: Collect the unsigned release APK
        id: collect
        shell: bash
        run: |
          set -euo pipefail
          apk="$(find crates/tauri-app/gen/android/app/build/outputs/apk/universal/release -name '*.apk' | head -1 || true)"
          [ -n "$apk" ] || { echo "no release APK produced"; find crates/tauri-app/gen/android -name '*.apk'; exit 1; }
          # Rename to the operator's brand name + version (desktop bundles are
          # already productName-named; keep Android consistent).
          product="$(python3 -c "import json;print(json.load(open('crates/tauri-app/tauri.conf.json'))['productName'])")"
          safe="$(printf '%s' "$product" | tr ' /' '__')"
          newname="${safe}_${{ inputs.version }}_universal.apk"
          mv "$apk" "$(dirname "$apk")/$newname"
          apk="$(dirname "$apk")/$newname"
          echo "apk=$apk" >> "$GITHUB_OUTPUT"
          echo "name=$newname" >> "$GITHUB_OUTPUT"
          echo "· built $apk" | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Upload UNSIGNED APK to R2 staging (installer/android-universal)
        shell: bash
        env:
          AWS_REQUEST_CHECKSUM_CALCULATION: when_required
          AWS_RESPONSE_CHECKSUM_VALIDATION: when_required
        run: |
          set -euo pipefail
          aws s3api put-object --endpoint-url "$R2_ENDPOINT" \
            --bucket "$STAGING_BUCKET" \
            --key "$BUILD_ID/installer/android-universal/${{ steps.collect.outputs.name }}" \
            --body "${{ steps.collect.outputs.apk }}" >/dev/null
          echo "· uploaded to s3://$STAGING_BUCKET/$BUILD_ID/installer/android-universal/${{ steps.collect.outputs.name }}"

      # Keep the raw APK as a run artifact for manual QA installs.
      - name: Upload APK run-artifact
        uses: actions/upload-artifact@v4
        with:
          name: quasar-android-${{ inputs.slug || 'default' }}-release-unsigned
          path: ${{ steps.collect.outputs.apk }}
          retention-days: 7

  # ── Fan-in: dispatch sign.yml ONCE after all selected builds succeed ─────────
  handoff:
    needs: [setup, compile, android]
    # Run when nothing FAILED and at least one build job actually produced output.
    # (compile/android are 'skipped' when their platform wasn't selected — fine.)
    # Partial success: hand off as long as the run wasn't cancelled and setup
    # produced a plan — even if SOME platforms failed. sign.yml publishes whatever
    # actually staged (it tolerates missing platforms) and its own guard fails the
    # sign job if NOTHING staged (all platforms failed → build reported failed).
    # (With fail-fast:false a partial failure leaves compile.result == 'failure'
    # while successful legs still staged, which the old gate wrongly blocked.)
    if: >-
      ${{ !cancelled() && needs.setup.result == 'success'
          && (needs.compile.result != 'skipped' || needs.android.result != 'skipped') }}
    runs-on: ubuntu-latest
    steps:
      - name: Dispatch private sign.yml (once, for all built platforms)
        uses: peter-evans/repository-dispatch@v3
        with:
          token: ${{ secrets.PRIVATE_DISPATCH_TOKEN }}   # fine-grained PAT: dispatch on codeman9528/QuasarAPP
          repository: codeman9528/QuasarAPP
          event-type: brand-build-signed
          client-payload: |
            {
              "build_id": "${{ inputs.build_id }}",
              "slug": "${{ inputs.slug }}",
              "version": "${{ inputs.version }}",
              "notes": ${{ toJSON(inputs.notes) }}
            }
