# =============================================================================
# build-android.yml  —  lives in the PUBLIC repo:  codeman9528/QuasarAPP-build
# Copy to that repo at  .github/workflows/build-android.yml
#
# SEPARATE from build.yml ON PURPOSE: Android's toolchain (NDK + Go/gomobile AAR)
# is heavier and newer, and build.yml uses fail-fast:true — a broken Android job
# in that matrix would CANCEL the working desktop builds. Keep it isolated.
#
# ── What it does (mirrors build.yml's decoupled model) ───────────────────────
#   1. build the embedded sing-box core AAR (Go + gomobile, arm64 + arm7)
#   2. apply brand, init the Android project, finalize gradle (AAR dep) + overlay
#      the tracked VPN/L3 sources, build an UNSIGNED RELEASE universal APK
#   3. upload the unsigned APK to R2 staging under installer/android-universal/
#   4. dispatch the PRIVATE repo's sign.yml, which apksigner-signs the APK with
#      the real release keystore (release environment) and publishes it to R2
#      release + installers.json — the same path desktop installers take.
#
# The Android release keystore therefore lives ONLY in the private repo (as the
# ANDROID_KEYSTORE_BASE64 / ANDROID_KEY_ALIAS / *_PASSWORD secrets), exactly like
# the L3 updater key. This public build never sees it.
#
# ⚠️ First runs will need iteration — this was authored without a full CI dry run.
#    Most likely spots: NDK version pinning, gomobile bind flags (see
#    scripts/build-qcore-aar.sh), and the `tauri android init` → finalize/overlay
#    reconciliation. Trigger it, read the log, iterate.
# =============================================================================
name: build-android

on:
  workflow_dispatch:
    inputs:
      slug:     { description: "brand slug (blank = default/unbranded)", required: false, default: "" }
      version:  { description: "release version, e.g. 1.4.2", required: true }
      build_id: { description: "orchestrator build id (echoed back to sign.yml)", required: true }

concurrency:
  group: build-android-${{ inputs.slug }}
  cancel-in-progress: true

env:
  SLUG:     ${{ inputs.slug }}
  VERSION:  ${{ inputs.version }}
  BUILD_ID: ${{ inputs.build_id }}
  # R2 staging endpoint + WRITE-ONLY-to-staging token (leak = throwaway bucket).
  R2_ENDPOINT:           ${{ vars.R2_ENDPOINT }}
  AWS_ACCESS_KEY_ID:     ${{ secrets.R2_STAGING_KEY_ID }}
  AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_STAGING_SECRET }}
  AWS_DEFAULT_REGION:    auto
  STAGING_BUCKET:        ${{ vars.STAGING_BUCKET }}

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout PRIVATE source (read-only deploy key)
        uses: actions/checkout@v4
        with:
          repository: codeman9528/QuasarAPP
          ssh-key: ${{ secrets.PRIVATE_REPO_DEPLOY_KEY }}

      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: "17" }

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
      - name: Install NDK + platform + build-tools
        run: sdkmanager "ndk;28.0.13004108" "platforms;android-34" "build-tools;34.0.0"

      # Pin NDK_HOME to the exact NDK we just installed and export it to the job
      # env. `${{ env.ANDROID_NDK_ROOT }}` isn't reliable in YAML (setup-android
      # sets it only as a process var), and tauri android init hard-fails on a
      # bad NDK_HOME. Exporting to $GITHUB_ENV makes it valid for every later step.
      - name: Pin NDK_HOME
        run: |
          NDK="$ANDROID_HOME/ndk/28.0.13004108"
          test -d "$NDK" || { echo "NDK not at $NDK"; ls "$ANDROID_HOME/ndk" || true; exit 1; }
          echo "NDK_HOME=$NDK" >> "$GITHUB_ENV"
          echo "ANDROID_NDK_ROOT=$NDK" >> "$GITHUB_ENV"
          echo "ANDROID_NDK_HOME=$NDK" >> "$GITHUB_ENV"

      # Go is needed for the gomobile AAR (the embedded sing-box core).
      - uses: actions/setup-go@v5
        with: { go-version: "1.23" }

      - uses: dtolnay/rust-toolchain@1.82.0
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi
      - uses: Swatinem/rust-cache@v2
      # No `version:` here — pnpm/action-setup@v4 errors if a version is given
      # both here AND via package.json's packageManager field. package.json pins
      # pnpm@9.12.0, so let the action read it from there.
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20, cache: pnpm }

      - name: Install Tauri CLI
        run: cargo install tauri-cli --version "^2.1" --locked

      - name: Build UI bundle
        run: |
          pnpm install --frozen-lockfile
          pnpm -C apps/ui build

      - name: Apply brand
        if: inputs.slug != ''
        env:
          TAURI_UPDATER_PUBKEY: ${{ vars.TAURI_UPDATER_PUBKEY }}
        run: cargo run -p quasar-builder -- apply --brand "brands/${{ inputs.slug }}/brand.yaml"

      - name: Fetch geo databases (bundled into the apk assets)
        run: bash scripts/fetch-geo.sh crates/tauri-app/resources/geo || echo "geo fetch failed (non-fatal for smoke build)"

      - name: Build embedded sing-box core AAR (arm64 + arm7)
        env:
          ANDROID_HOME: ${{ env.ANDROID_HOME }}
          NDK_HOME: ${{ env.ANDROID_NDK_ROOT }}
        run: TARGETS=android/arm64,android/arm bash scripts/build-qcore-aar.sh

      - name: Init Android project (generates gen/android)
        env:
          NDK_HOME: ${{ env.ANDROID_NDK_ROOT }}
        run: |
          cd crates/tauri-app
          cargo tauri android init

      - name: Finalize gradle (link the core AAR) + overlay VPN/L3 sources
        run: |
          bash scripts/android-finalize-gradle.sh
          bash scripts/android-overlay.sh

      - name: Build UNSIGNED RELEASE universal APK (arm64-v8a + armeabi-v7a)
        env:
          ANDROID_HOME: ${{ env.ANDROID_HOME }}
          NDK_HOME: ${{ env.ANDROID_NDK_ROOT }}
        # No ANDROID_KEYSTORE in env → build-android-apk.sh leaves it unsigned;
        # sign.yml signs it in the private repo with the real release key.
        run: bash scripts/build-android-apk.sh

      - name: Collect the unsigned release APK
        id: collect
        shell: bash
        run: |
          set -euo pipefail
          apk="$(find crates/tauri-app/gen/android/app/build/outputs/apk/universal/release -name '*.apk' | head -1 || true)"
          [ -n "$apk" ] || { echo "no release APK produced"; find crates/tauri-app/gen/android -name '*.apk'; exit 1; }
          echo "apk=$apk" >> "$GITHUB_OUTPUT"
          echo "name=$(basename "$apk")" >> "$GITHUB_OUTPUT"
          echo "· built $apk" | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Upload UNSIGNED APK to R2 staging (installer/android-universal)
        shell: bash
        run: |
          set -euo pipefail
          # Single-part PUT (s3api put-object), NOT `aws s3 cp` — cp auto-switches
          # to multipart for files >8MB, and R2 bucket-scoped tokens reject
          # CreateMultipartUpload ("Unauthorized"). put-object is one PUT (≤5GB ok).
          aws s3api put-object --endpoint-url "$R2_ENDPOINT" \
            --bucket "$STAGING_BUCKET" \
            --key "$BUILD_ID/installer/android-universal/${{ steps.collect.outputs.name }}" \
            --body "${{ steps.collect.outputs.apk }}" >/dev/null
          echo "· uploaded to s3://$STAGING_BUCKET/$BUILD_ID/installer/android-universal/${{ steps.collect.outputs.name }}"

      # Also keep the raw APK as a run artifact for manual QA installs.
      - name: Upload APK run-artifact
        uses: actions/upload-artifact@v4
        with:
          name: quasar-android-${{ inputs.slug || 'default' }}-release-unsigned
          path: ${{ steps.collect.outputs.apk }}
          retention-days: 7

      - name: Dispatch private sign.yml (apksigner + publish)
        uses: peter-evans/repository-dispatch@v3
        with:
          token: ${{ secrets.PRIVATE_DISPATCH_TOKEN }}
          repository: codeman9528/QuasarAPP
          event-type: brand-build-signed
          client-payload: |
            {"build_id":"${{ env.BUILD_ID }}","slug":"${{ env.SLUG }}","version":"${{ env.VERSION }}"}
